<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spira</title>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <button id="breath" aria-label="Esercizio respiratorio">
        <span class="halo halo-a"></span>
        <span class="halo halo-b"></span>
        <span id="left-nostril" class="nostril left" aria-hidden="true"></span>
        <span id="orb" class="orb"><span id="countdown">4</span></span>
        <span id="right-nostril" class="nostril right" aria-hidden="true"></span>
      </button>
      <section id="help" class="hidden" aria-modal="true" role="dialog" aria-label="Scorciatoie">
        <div class="help-card">
          <h1>spira</h1>
          <dl>
            <dt>S</dt><dd>inizia / ricomincia</dd>
            <dt>P</dt><dd>pausa / riprendi</dd>
            <dt>1–5</dt><dd>scegli esercizio</dd>
            <dt>M</dt><dd>audio</dd>
            <dt>Ctrl + T</dt><dd>sempre sopra</dd>
            <dt>Home</dt><dd>ripristina posizione</dd>
            <dt>Esc</dt><dd>interrompi</dd>
          </dl>
          <p>Respira dolcemente. Interrompi se avverti vertigini.</p>
          <button id="close-help" aria-label="Chiudi istruzioni">×</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
